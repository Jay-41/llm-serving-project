# Prometheus scrape config for the serving layer.
#
# scrape_interval is 1s, which is far more aggressive than a production default
# (15-60s). It is deliberate here: the benchmark runs this project cares about
# last 20-45 seconds, and at a 15s interval a whole overload episode would be
# three data points. One target, tiny payload, short runs — the cost is
# negligible and the resolution is the entire point.
#
# Raise this to 15s before deploying anything long-lived (Phase 4.3).

global:
  scrape_interval: 1s
  evaluation_interval: 1s
  external_labels:
    project: llm-serving

scrape_configs:
  - job_name: llm-serving
    metrics_path: /metrics
    static_configs:
      # Compose service name — Docker's embedded DNS resolves "app" to the
      # serving container on the project network. To point this at an app
      # running on the host instead, use host.docker.internal:8000 and start
      # Prometheus with --add-host=host.docker.internal:host-gateway.
      - targets: ["app:8000"]
        labels:
          instance: compose

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
