# Builds the Phase 6 GPU image on an x86 runner and pushes it to GHCR.
#
# Why CI rather than a laptop: the dev machine is an ARM Mac, and a CUDA image
# is x86-only. Building it locally means QEMU-emulating every pip install of a
# multi-GB torch wheel. The runner does it natively in minutes.
#
# Triggers only on changes that affect the image, so ordinary commits do not
# burn 10 minutes of CI rebuilding torch.

name: gpu-image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.gpu
      - requirements.txt
      - requirements-model.txt
      - app/**
      - bench/**
      - .github/workflows/gpu-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The CUDA base plus torch is ~6GB; the default runner has ~14GB free.
      # Clearing preinstalled toolchains we do not need keeps the build off the
      # disk-full cliff.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires lowercase image names; github.repository_owner keeps the
      # account's capitalisation ("Jay-41").
      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/llm-serving-gpu" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gpu
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
